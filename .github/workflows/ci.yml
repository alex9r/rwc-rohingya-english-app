name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: pytest backend

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check ml
      # The speech and pronunciation tests use a fake model, so no Whisper download.
      # pronunciation's requirements include speech's.
      - name: Speech and pronunciation tests
        run: |
          pip install -r ml/pronunciation/requirements.txt
          python -m pytest ml/speech ml/pronunciation -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stub mode (no Whisper) keeps this fast; it catches a broken Dockerfile.
      - name: Build the API image
        run: docker build -f backend/Dockerfile -t rwc-api:ci .
