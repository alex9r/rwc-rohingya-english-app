name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: pytest backend

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check ml
      # The speech tests use a fake model, so no Whisper download. Skipped until
      # ml/speech lands on this branch.
      - name: Speech tests
        run: |
          if [ -f ml/speech/requirements.txt ]; then
            pip install -r ml/speech/requirements.txt
            python -m pytest ml/speech -q
          else
            echo "ml/speech not present yet; skipping"
          fi
