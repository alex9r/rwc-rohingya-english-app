name: Deploy

# Builds the API image with Whisper baked in, pushes it to ECR, publishes it as a new
# Lambda version and points the "live" alias (which API Gateway calls) at it. If the
# smoke test fails, the alias goes back to the previous version.
# Every job skips until the AWS account exists and the repo variables are set
# (see infra/README.md, "First deployment").
on:
  push:
    branches: [main]
    paths: ["backend/**", "ml/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC: short-lived AWS credentials, no stored keys

jobs:
  deploy:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production # needs a reviewer; the AWS role only trusts this environment
    env:
      AWS_REGION: ca-central-1
      FUNCTION: ${{ vars.LAMBDA_FUNCTION }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # linux/amd64 to match the function's architecture. --provenance=false: buildx
      # otherwise adds an attestation manifest, and Lambda rejects multi-manifest images.
      - name: Build and push the image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile --platform linux/amd64 --provenance=false \
            --build-arg INSTALL_SPEECH=1 -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # First deployment: Terraform can't create the function until an image exists, so
      # this run only pushes it. Then run the full terraform apply with image_tag = this SHA.
      - id: exists
        name: Check the function exists
        run: |
          if aws lambda get-function --function-name "$FUNCTION" > /dev/null 2>&1; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Function $FUNCTION doesn't exist yet. Image pushed as ${{ github.sha }}; set image_tag to it and run the full terraform apply (infra/README.md step 5)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - id: deploy
        name: Publish a new version and move the live alias
        if: steps.exists.outputs.deploy == 'true'
        run: |
          previous=$(aws lambda get-alias --function-name "$FUNCTION" --name live \
            --query FunctionVersion --output text)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "live is version $previous"

          aws lambda update-function-code --function-name "$FUNCTION" \
            --image-uri "$IMAGE" > /dev/null
          aws lambda wait function-updated --function-name "$FUNCTION"

          # The new version also picks up any configuration Terraform changed.
          version=$(aws lambda publish-version --function-name "$FUNCTION" \
            --description "${{ github.sha }}" --query Version --output text)
          for _ in $(seq 1 60); do
            state=$(aws lambda get-function-configuration --function-name "$FUNCTION" \
              --qualifier "$version" --query State --output text)
            [ "$state" = "Active" ] && break
            [ "$state" = "Failed" ] && { echo "::error::Version $version failed to become active"; exit 1; }
            sleep 5
          done
          [ "$state" = "Active" ] || { echo "::error::Version $version still $state"; exit 1; }

          aws lambda update-alias --function-name "$FUNCTION" --name live \
            --function-version "$version" > /dev/null
          echo "live is now version $version"

      # Retries absorb the cold start (image load plus Whisper) on the new version.
      - name: Smoke test
        if: steps.exists.outputs.deploy == 'true'
        run: |
          curl -fsS --max-time 35 --retry 6 --retry-delay 15 --retry-all-errors \
            "${{ vars.API_URL }}/health" > health.json
          python3 - <<'PY'
          import json
          health = json.load(open("health.json"))
          print(health)
          assert health["status"] == "ok", "API not ok"
          assert health["data_source"] == "dynamodb", "not reading DynamoDB (lexicon not loaded?)"
          assert health["ml"]["transcribe"] == "real", "transcription is in stub mode"
          assert health["ml"]["pronunciation"] == "real", "pronunciation scoring is in stub mode"
          PY

      # Replaces the ECS circuit breaker: traffic goes back to the last good version.
      - name: Roll back the live alias
        if: failure() && steps.deploy.outputs.previous != ''
        run: |
          aws lambda update-alias --function-name "$FUNCTION" --name live \
            --function-version "${{ steps.deploy.outputs.previous }}" > /dev/null
          echo "::error::Deploy failed; live rolled back to version ${{ steps.deploy.outputs.previous }}"
