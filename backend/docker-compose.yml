services:
  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      # Repo root
      context: ..
      dockerfile: backend/Dockerfile
      args:
        INSTALL_SPEECH: ${INSTALL_SPEECH:-0}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-dir ml
    env_file: .env
    environment:
      POSTGRES_HOST: db
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${API_HOST_PORT}:8000"
    volumes:
      - ./app:/app/app
      - ../ml:/app/ml
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
