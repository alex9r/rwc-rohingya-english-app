services:
  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      # Repo root
      context: ..
      dockerfile: backend/Dockerfile
      args:
        INSTALL_SPEECH: ${INSTALL_SPEECH:-0}
        RWC_WHISPER_MODEL: ${RWC_WHISPER_MODEL:-small}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-dir ml
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8081,http://localhost:19006}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${API_HOST_PORT}:8000"
    volumes:
      - ./app:/app/app
      - ../ml:/app/ml
      # Whisper model cache (HF_HOME in the Dockerfile)
      - hf_cache:/opt/hf
    depends_on:
      db:
        condition: service_healthy

  # Optional local DynamoDB: docker compose --profile dynamo up -d dynamodb-local
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.3
    profiles: [dynamo]
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports:
      - "8001:8000"

volumes:
  pgdata:
  hf_cache:
